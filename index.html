<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foraging Log</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --moss-dark:#202b1b;
    --moss-mid:#2f3d26;
    --paper:#eee6d1;
    --paper-dim:#e2d8bf;
    --bark:#5c4632;
    --berry:#9c2b3f;
    --berry-dark:#7a1f30;
    --gold:#c99a3e;
    --ink:#2a2a22;
    --great:#3f7d4a;
    --medium:#c99a3e;
    --ok:#8a7a63;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(255,255,255,0.03), transparent 40%),
      var(--moss-dark);
    color:var(--paper);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
    padding:32px 16px 64px;
  }

  .wrap{
    max-width:560px;
    margin:0 auto;
  }

  header{
    text-align:center;
    margin-bottom:28px;
  }

  .mark{
    font-size:28px;
    display:inline-block;
    margin-bottom:6px;
    filter: drop-shadow(0 2px 0 rgba(0,0,0,0.3));
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.1rem;
    margin:0;
    letter-spacing:0.01em;
    color:var(--paper);
  }

  .tagline{
    font-size:0.85rem;
    color:#b9c2ab;
    margin-top:6px;
    font-style:italic;
    letter-spacing:0.02em;
  }

  .log-btn{
    display:block;
    width:100%;
    border:none;
    border-radius:999px;
    padding:18px 20px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    letter-spacing:0.01em;
    background:var(--berry);
    color:#fbeee0;
    cursor:pointer;
    box-shadow: 0 4px 0 var(--berry-dark), 0 8px 16px rgba(0,0,0,0.35);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }
  .log-btn:active{
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--berry-dark), 0 4px 10px rgba(0,0,0,0.3);
  }
  .log-btn:disabled{
    opacity:0.6;
    cursor:wait;
  }

  .status-line{
    text-align:center;
    font-size:0.8rem;
    color:#b9c2ab;
    margin-top:10px;
    min-height:1.2em;
  }

  /* Form card */
  .form-card{
    background:var(--paper);
    color:var(--ink);
    border-radius:14px;
    padding:20px 20px 18px;
    margin-top:18px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
    display:none;
  }
  .form-card.open{ display:block; }

  .form-card .coords{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    color:var(--bark);
    margin-bottom:14px;
    letter-spacing:0.01em;
  }

  .field{
    margin-bottom:14px;
  }
  .field label{
    display:block;
    font-size:0.75rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--bark);
    margin-bottom:6px;
  }
  .field input, .field textarea{
    width:100%;
    padding:10px 12px;
    border-radius:8px;
    border:1px solid #cfc4a4;
    background:#faf6ea;
    font-family:'Work Sans', sans-serif;
    font-size:0.95rem;
    color:var(--ink);
    resize:vertical;
  }
  .field textarea{ min-height:64px; }

  .rating-row{
    display:flex;
    gap:8px;
  }
  .rating-btn{
    flex:1;
    padding:9px 0;
    border-radius:8px;
    border:2px solid #cfc4a4;
    background:#faf6ea;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.82rem;
    cursor:pointer;
    color:var(--ink);
    opacity:0.55;
  }
  .rating-btn.selected{ opacity:1; border-color:currentColor; }
  .rating-btn[data-rating="great"]{ color:var(--great); }
  .rating-btn[data-rating="medium"]{ color:var(--medium); }
  .rating-btn[data-rating="ok"]{ color:var(--ok); }

  .form-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .form-actions button{
    flex:1;
    padding:11px 0;
    border-radius:8px;
    border:none;
    font-family:'Work Sans', sans-serif;
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
  }
  .save-btn{ background:var(--moss-mid); color:#f4efe0; }
  .cancel-btn{ background:transparent; color:var(--bark); border:1px solid #cfc4a4 !important; }

  .backup-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:8px;
    margin-top:16px;
    font-size:0.78rem;
  }
  .backup-row button, .backup-row label{
    background:none;
    border:none;
    color:#b9c2ab;
    text-decoration:underline;
    text-decoration-color:#5a6b4a;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    padding:0;
  }
  .backup-row button:hover, .backup-row label:hover{
    color:var(--gold);
  }
  .backup-sep{ color:#5a6b4a; }

  /* Tabs */
  .tabs{
    display:flex;
    gap:6px;
    margin:32px 0 16px;
    background:#182013;
    border-radius:999px;
    padding:4px;
  }
  .tab-btn{
    flex:1;
    border:none;
    background:none;
    padding:9px 0;
    border-radius:999px;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:0.92rem;
    color:#8a9578;
    cursor:pointer;
  }
  .tab-btn.active{
    background:var(--moss-mid);
    color:var(--paper);
  }

  .view{ display:none; }
  .view.active{ display:block; }

  .empty{
    text-align:center;
    color:#8a9578;
    font-size:0.9rem;
    padding:24px 10px;
    font-style:italic;
  }

  /* Map */
  #mapContainer{
    height:420px;
    border-radius:14px;
    overflow:hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  .map-legend{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-top:12px;
    font-size:0.78rem;
    color:#b9c2ab;
  }
  .map-legend span{
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .legend-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    display:inline-block;
  }
  .popup-fruit{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1rem;
    margin-bottom:2px;
  }
  .popup-note{ font-size:0.85rem; margin-bottom:6px; }
  .popup-links a{
    font-size:0.78rem;
    margin-right:10px;
    color:var(--berry-dark);
  }

  .fruit-pin-wrapper{ background:transparent; border:none; }
  .fruit-pin{
    width:34px;
    height:34px;
    border-radius:50% 50% 50% 0;
    transform: rotate(-45deg);
    border:2px solid #20291a;
    box-shadow: 0 3px 6px rgba(0,0,0,0.4);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .fruit-pin-emoji{
    transform: rotate(45deg);
    font-size:16px;
    line-height:1;
  }

  .find{
    background:var(--paper-dim);
    color:var(--ink);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    position:relative;
    border-left:4px solid var(--berry);
  }

  .find-editing{
    border-left:4px solid var(--gold);
  }
  .find-editing .field label{
    color:var(--bark);
  }
  .find-editing .find-coords{
    margin:8px 0 12px;
  }

  .find-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }

  .find-name-row{
    display:flex;
    align-items:center;
    gap:8px;
  }

  .quick-rate{
    display:flex;
    gap:5px;
    flex-shrink:0;
  }
  .quick-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    display:inline-block;
    border:2px solid var(--dot-color);
    background:transparent;
    cursor:pointer;
    transition: background 0.1s ease;
  }
  .quick-dot.active{
    background:var(--dot-color);
  }
  .quick-dot:hover{
    opacity:0.8;
  }

  .find-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.1rem;
  }

  .find-date{
    font-size:0.72rem;
    color:var(--bark);
    white-space:nowrap;
    font-family:'IBM Plex Mono', monospace;
  }

  .find-note{
    font-size:0.9rem;
    margin-top:4px;
    color:#3c3c30;
  }

  .find-bottom{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
  }

  .find-coords{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.72rem;
    color:var(--bark);
  }

  .find-actions a, .find-actions button{
    font-size:0.72rem;
    text-decoration:none;
    color:var(--berry-dark);
    background:none;
    border:none;
    cursor:pointer;
    font-family:'Work Sans', sans-serif;
    margin-left:12px;
  }

  @media (prefers-reduced-motion: reduce){
    .log-btn{ transition:none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="mark">🌿</div>
      <h1>Foraging Log</h1>
      <div class="tagline">a running record of what you've found, and where</div>
    </header>

    <button class="log-btn" id="logBtn">● Log a find</button>
    <div class="status-line" id="statusLine"></div>

    <div class="form-card" id="formCard">
      <div class="coords" id="coordsLine"></div>
      <div class="field">
        <label for="fruitInput">Fruit</label>
        <input type="text" id="fruitInput" placeholder="e.g. blackberries, wild apple">
      </div>
      <div class="field">
        <label for="noteInput">Notes</label>
        <textarea id="noteInput" placeholder="ripe, near the old fence, tree is on the south side of the trail..."></textarea>
      </div>
      <div class="field">
        <label>Rating</label>
        <div class="rating-row" id="ratingRow">
          <button type="button" class="rating-btn" data-rating="great">Great</button>
          <button type="button" class="rating-btn" data-rating="medium">Medium</button>
          <button type="button" class="rating-btn" data-rating="ok">Ok</button>
        </div>
      </div>
      <div class="form-actions">
        <button class="save-btn" id="saveBtn">Save find</button>
        <button class="cancel-btn" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <div class="backup-row">
      <button id="exportBtn">Export backup</button>
      <span class="backup-sep">·</span>
      <label for="importInput" id="importLabel">Import backup</label>
      <input type="file" id="importInput" accept="application/json" hidden>
    </div>
    <div class="status-line" id="backupStatus"></div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="list">List</button>
      <button class="tab-btn" data-tab="map">Map</button>
    </div>

    <div class="view active" id="listView">
      <div id="findsList"></div>
    </div>

    <div class="view" id="mapView">
      <div id="mapContainer"></div>
      <div class="map-legend">
        <span><span class="legend-dot" style="background:var(--great)"></span>Great</span>
        <span><span class="legend-dot" style="background:var(--medium)"></span>Medium</span>
        <span><span class="legend-dot" style="background:var(--ok)"></span>Ok</span>
      </div>
    </div>
  </div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const STORAGE_KEY = 'finds';
let pendingCoords = null;
let finds = [];
let selectedRating = null;
let editingId = null;
let leafletMap = null;
let mapMarkers = [];

const RATING_COLORS = { great: '#3f7d4a', medium: '#c99a3e', ok: '#8a7a63' };

const logBtn = document.getElementById('logBtn');
const statusLine = document.getElementById('statusLine');
const formCard = document.getElementById('formCard');
const coordsLine = document.getElementById('coordsLine');
const fruitInput = document.getElementById('fruitInput');
const noteInput = document.getElementById('noteInput');
const ratingRow = document.getElementById('ratingRow');
const saveBtn = document.getElementById('saveBtn');
const cancelBtn = document.getElementById('cancelBtn');
const findsList = document.getElementById('findsList');
const listView = document.getElementById('listView');
const mapView = document.getElementById('mapView');

async function loadFinds(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    finds = raw ? JSON.parse(raw) : [];
  }catch(err){
    finds = [];
  }
  renderFinds();
}

async function saveFinds(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(finds));
  }catch(err){
    statusLine.textContent = "Couldn't save — try again.";
  }
}

function formatCoords(lat, lon){
  return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
}

function mapsUrl(lat, lon){
  return `https://www.google.com/maps?q=${lat},${lon}`;
}

function directionsUrl(lat, lon){
  return `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`;
}

function formatDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function ratingLabel(r){
  if(r === 'great') return 'Great';
  if(r === 'medium') return 'Medium';
  if(r === 'ok') return 'Ok';
  return '';
}

function fruitEmoji(name){
  const n = (name || '').toLowerCase();
  const table = [
    [['apple', 'crabapple'], '🍎'],
    [['pear'], '🍐'],
    [['yellow plum'], '🟡'],
    [['green plum'], '🟢'],
    [['plum'], '🟣'],
    [['peach'], '🍑'],
    [['cherry', 'cherries'], '🍒'],
    [['grape'], '🍇'],
    [['olive'], '🫒'],
    [['fig'], '🟤'],
    [['persimmon'], '🟠'],
    [['blackberr'], '🫐'],
    [['raspberr'], '🍓'],
    [['strawberr'], '🍓'],
    [['blueberr'], '🫐'],
    [['mulberr'], '🫐'],
    [['elderberr'], '🫐'],
    [['berry', 'berries'], '🫐'],
    [['orange', 'citrus', 'tangerine', 'mandarin'], '🍊'],
    [['lemon'], '🍋'],
    [['lime'], '🍈'],
    [['melon', 'cantaloupe'], '🍈'],
    [['watermelon'], '🍉'],
    [['banana'], '🍌'],
    [['pineapple'], '🍍'],
    [['kiwi'], '🥝'],
    [['coconut'], '🥥'],
    [['pawpaw'], '🍈'],
    [['rosehip', 'rose hip'], '🌹'],
    [['mushroom', 'chanterelle', 'morel', 'porcini', 'bolete'], '🍄'],
    [['walnut', 'hazelnut', 'chestnut', 'acorn', 'nut'], '🌰'],
    [['tomato'], '🍅'],
    [['pepper'], '🌶️'],
    [['squash', 'pumpkin'], '🎃'],
    [['nettle', 'herb', 'wild garlic', 'ramps'], '🌿']
  ];
  for(const [keywords, emoji] of table){
    if(keywords.some(k => n.includes(k))) return emoji;
  }
  return '⚪';
}

/* ---------- Tabs ---------- */
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const tab = btn.getAttribute('data-tab');
    listView.classList.toggle('active', tab === 'list');
    mapView.classList.toggle('active', tab === 'map');
    if(tab === 'map'){
      initOrRefreshMap();
    }
  });
});

/* ---------- List rendering ---------- */
function renderFinds(){
  if(finds.length === 0){
    findsList.innerHTML = '<div class="empty">No finds logged yet — go track something down.</div>';
    return;
  }
  const sorted = [...finds].sort((a,b) => new Date(b.date) - new Date(a.date));
  findsList.innerHTML = sorted.map(f => {
    if(f.id === editingId){
      return `
        <div class="find find-editing" data-id="${f.id}">
          <div class="field">
            <label>Fruit</label>
            <input type="text" class="edit-fruit" value="${escapeHtml(f.fruit)}">
          </div>
          <div class="field">
            <label>Notes</label>
            <textarea class="edit-note">${escapeHtml(f.note || '')}</textarea>
          </div>
          <div class="field">
            <label>Rating</label>
            <div class="rating-row edit-rating-row">
              <button type="button" class="rating-btn ${f.rating==='great'?'selected':''}" data-rating="great">Great</button>
              <button type="button" class="rating-btn ${f.rating==='medium'?'selected':''}" data-rating="medium">Medium</button>
              <button type="button" class="rating-btn ${f.rating==='ok'?'selected':''}" data-rating="ok">Ok</button>
            </div>
          </div>
          <div class="find-coords">${formatCoords(f.lat, f.lon)}</div>
          <div class="form-actions">
            <button class="save-btn" data-save-edit="${f.id}">Save changes</button>
            <button class="cancel-btn" data-cancel-edit="${f.id}">Cancel</button>
          </div>
        </div>
      `;
    }
    return `
    <div class="find" data-id="${f.id}">
      <div class="find-top">
        <div class="find-name-row">
          <div class="quick-rate" data-quick-id="${f.id}">
            <span class="quick-dot ${f.rating==='great'?'active':''}" data-quick-rating="great" style="--dot-color:${RATING_COLORS.great}"></span>
            <span class="quick-dot ${f.rating==='medium'?'active':''}" data-quick-rating="medium" style="--dot-color:${RATING_COLORS.medium}"></span>
            <span class="quick-dot ${f.rating==='ok'?'active':''}" data-quick-rating="ok" style="--dot-color:${RATING_COLORS.ok}"></span>
          </div>
          <div class="find-name">${escapeHtml(f.fruit)}</div>
        </div>
        <div class="find-date">${formatDate(f.date)}</div>
      </div>
      ${f.note ? `<div class="find-note">${escapeHtml(f.note)}</div>` : ''}
      <div class="find-bottom">
        <div class="find-coords">${formatCoords(f.lat, f.lon)}</div>
        <div class="find-actions">
          <a href="${directionsUrl(f.lat, f.lon)}" target="_blank" rel="noopener">Get directions</a>
          <a href="${mapsUrl(f.lat, f.lon)}" target="_blank" rel="noopener">View on map</a>
          <button data-edit="${f.id}">Edit</button>
          <button data-delete="${f.id}">Delete</button>
        </div>
      </div>
    </div>
  `;
  }).join('');

  findsList.querySelectorAll('[data-delete]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-delete');
      finds = finds.filter(f => f.id !== id);
      await saveFinds();
      renderFinds();
      if(leafletMap) initOrRefreshMap();
    });
  });

  findsList.querySelectorAll('.quick-dot').forEach(dot => {
    dot.addEventListener('click', async () => {
      const wrapper = dot.closest('.quick-rate');
      const id = wrapper.getAttribute('data-quick-id');
      const rating = dot.getAttribute('data-quick-rating');
      const target = finds.find(f => f.id === id);
      if(target){
        target.rating = (target.rating === rating) ? null : rating;
      }
      await saveFinds();
      renderFinds();
      if(leafletMap) initOrRefreshMap();
    });
  });

  findsList.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = btn.getAttribute('data-edit');
      renderFinds();
    });
  });

  findsList.querySelectorAll('[data-cancel-edit]').forEach(btn => {
    btn.addEventListener('click', () => {
      editingId = null;
      renderFinds();
    });
  });

  findsList.querySelectorAll('.edit-rating-row').forEach(row => {
    row.querySelectorAll('.rating-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        row.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      });
    });
  });

  findsList.querySelectorAll('[data-save-edit]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const id = btn.getAttribute('data-save-edit');
      const card = findsList.querySelector(`.find-editing[data-id="${id}"]`);
      const newFruit = card.querySelector('.edit-fruit').value.trim();
      const newNote = card.querySelector('.edit-note').value.trim();
      const selectedBtn = card.querySelector('.rating-btn.selected');
      const newRating = selectedBtn ? selectedBtn.getAttribute('data-rating') : null;
      if(!newFruit) return;

      const target = finds.find(f => f.id === id);
      if(target){
        target.fruit = newFruit;
        target.note = newNote;
        target.rating = newRating;
      }
      editingId = null;
      await saveFinds();
      renderFinds();
      if(leafletMap) initOrRefreshMap();
    });
  });
}

/* ---------- Map ---------- */
function initOrRefreshMap(){
  if(!leafletMap){
    leafletMap = L.map('mapContainer');
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(leafletMap);
  }

  mapMarkers.forEach(m => leafletMap.removeLayer(m));
  mapMarkers = [];

  if(finds.length === 0){
    leafletMap.setView([45.5152, -122.6784], 11);
    return;
  }

  finds.forEach(f => {
    const color = RATING_COLORS[f.rating] || '#b9ab8a';
    const emoji = fruitEmoji(f.fruit);
    const icon = L.divIcon({
      className: 'fruit-pin-wrapper',
      html: `
        <div class="fruit-pin" style="background:${color};">
          <span class="fruit-pin-emoji">${emoji}</span>
        </div>
      `,
      iconSize: [34, 34],
      iconAnchor: [17, 32],
      popupAnchor: [0, -30]
    });
    const marker = L.marker([f.lat, f.lon], { icon }).addTo(leafletMap);

    const popupHtml = `
      <div class="popup-fruit">${emoji} ${escapeHtml(f.fruit)}</div>
      ${f.note ? `<div class="popup-note">${escapeHtml(f.note)}</div>` : ''}
      ${f.rating ? `<div class="popup-note">Rating: ${ratingLabel(f.rating)}</div>` : ''}
      <div class="popup-links">
        <a href="${directionsUrl(f.lat, f.lon)}" target="_blank" rel="noopener">Get directions</a>
      </div>
    `;
    marker.bindPopup(popupHtml);
    mapMarkers.push(marker);
  });

  const bounds = L.latLngBounds(finds.map(f => [f.lat, f.lon]));
  leafletMap.fitBounds(bounds, { padding: [30, 30], maxZoom: 16 });

  setTimeout(() => leafletMap.invalidateSize(), 50);
}

/* ---------- Log form ---------- */
ratingRow.querySelectorAll('.rating-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    ratingRow.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedRating = btn.getAttribute('data-rating');
  });
});

logBtn.addEventListener('click', () => {
  if(!navigator.geolocation){
    statusLine.textContent = "Location isn't available in this browser.";
    return;
  }
  logBtn.disabled = true;
  statusLine.textContent = "Getting your location...";

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      pendingCoords = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      coordsLine.textContent = `📍 ${formatCoords(pendingCoords.lat, pendingCoords.lon)}`;
      formCard.classList.add('open');
      statusLine.textContent = "";
      logBtn.disabled = false;
      fruitInput.focus();
    },
    (err) => {
      statusLine.textContent = "Couldn't get your location — check permissions and try again.";
      logBtn.disabled = false;
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

cancelBtn.addEventListener('click', () => {
  formCard.classList.remove('open');
  fruitInput.value = '';
  noteInput.value = '';
  pendingCoords = null;
  selectedRating = null;
  ratingRow.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
});

saveBtn.addEventListener('click', async () => {
  const fruit = fruitInput.value.trim();
  if(!fruit){
    fruitInput.focus();
    return;
  }
  if(!pendingCoords) return;

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    fruit,
    note: noteInput.value.trim(),
    rating: selectedRating,
    lat: pendingCoords.lat,
    lon: pendingCoords.lon,
    date: new Date().toISOString()
  };

  finds.push(entry);
  await saveFinds();
  renderFinds();
  if(leafletMap) initOrRefreshMap();

  formCard.classList.remove('open');
  fruitInput.value = '';
  noteInput.value = '';
  pendingCoords = null;
  selectedRating = null;
  ratingRow.querySelectorAll('.rating-btn').forEach(b => b.classList.remove('selected'));
});

/* ---------- Backup ---------- */
const exportBtn = document.getElementById('exportBtn');
const importInput = document.getElementById('importInput');
const backupStatus = document.getElementById('backupStatus');

exportBtn.addEventListener('click', () => {
  if(finds.length === 0){
    backupStatus.textContent = "Nothing to export yet.";
    return;
  }
  const blob = new Blob([JSON.stringify(finds, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = `foraging-log-backup-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  backupStatus.textContent = `Exported ${finds.length} find${finds.length === 1 ? '' : 's'}.`;
});

importInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;

  try{
    const text = await file.text();
    const imported = JSON.parse(text);
    if(!Array.isArray(imported)) throw new Error('not an array');

    const existingIds = new Set(finds.map(f => f.id));
    let added = 0;
    for(const item of imported){
      if(item && item.id && item.fruit && !existingIds.has(item.id)){
        finds.push(item);
        existingIds.add(item.id);
        added++;
      }
    }
    await saveFinds();
    renderFinds();
    if(leafletMap) initOrRefreshMap();
    backupStatus.textContent = added > 0
      ? `Imported ${added} new find${added === 1 ? '' : 's'} (duplicates skipped).`
      : "Nothing new to import — all finds already here.";
  }catch(err){
    backupStatus.textContent = "Couldn't read that file — make sure it's a backup exported from here.";
  }
  importInput.value = '';
});

loadFinds();
</script>
